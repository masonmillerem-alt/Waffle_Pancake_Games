<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #faf8ef;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #776e65;
}

.game {
    width: 500px;
    max-width: 95vw;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

h1 {
    font-size: 70px;
    margin: 0;
    font-weight: bold;
}

.score-box {
    background: #bbada0;
    color: white;
    padding: 8px 18px;
    border-radius: 6px;
    text-align: center;
    min-width: 90px;
}

.score-label {
    font-size: 13px;
    font-weight: bold;
}

#score {
    font-size: 25px;
    font-weight: bold;
}

.instructions {
    font-size: 15px;
    margin-bottom: 12px;
}

.board {
    width: 100%;
    aspect-ratio: 1;
    background: #bbada0;
    border-radius: 8px;
    padding: 10px;
    position: relative;
}

/* Empty squares */
.cell {
    position: absolute;
    width: calc((100% - 50px) / 4);
    height: calc((100% - 50px) / 4);
    background: #cdc1b4;
    border-radius: 6px;
}

.cell:nth-child(1) { left: 10px; top: 10px; }
.cell:nth-child(2) { left: calc(25% + 2px); top: 10px; }
.cell:nth-child(3) { left: calc(50% - 6px); top: 10px; }
.cell:nth-child(4) { right: 10px; top: 10px; }

.cell:nth-child(5) { left: 10px; top: calc(25% + 2px); }
.cell:nth-child(6) { left: calc(25% + 2px); top: calc(25% + 2px); }
.cell:nth-child(7) { left: calc(50% - 6px); top: calc(25% + 2px); }
.cell:nth-child(8) { right: 10px; top: calc(25% + 2px); }

.cell:nth-child(9) { left: 10px; top: calc(50% - 6px); }
.cell:nth-child(10) { left: calc(25% + 2px); top: calc(50% - 6px); }
.cell:nth-child(11) { left: calc(50% - 6px); top: calc(50% - 6px); }
.cell:nth-child(12) { right: 10px; top: calc(50% - 6px); }

.cell:nth-child(13) { left: 10px; bottom: 10px; }
.cell:nth-child(14) { left: calc(25% + 2px); bottom: 10px; }
.cell:nth-child(15) { left: calc(50% - 6px); bottom: 10px; }
.cell:nth-child(16) { right: 10px; bottom: 10px; }

/* Tiles */
.tile {
    position: absolute;

    width: calc((100% - 50px) / 4);
    height: calc((100% - 50px) / 4);

    border-radius: 6px;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: clamp(28px, 8vw, 48px);
    font-weight: bold;

    z-index: 5;

    transition:
        left 140ms ease-in-out,
        top 140ms ease-in-out;
}

.tile.spawn {
    animation: spawn 140ms ease-out;
}

.tile.merge {
    animation: merge 160ms ease-out;
    z-index: 6;
}

@keyframes spawn {
    0% {
        transform: scale(0);
    }

    70% {
        transform: scale(1.12);
    }

    100% {
        transform: scale(1);
    }
}

@keyframes merge {
    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.15);
    }

    100% {
        transform: scale(1);
    }
}

/* Tile colors */

.tile-2 {
    background: #eee4da;
    color: #776e65;
}

.tile-4 {
    background: #ede0c8;
    color: #776e65;
}

.tile-8 {
    background: #f2b179;
    color: white;
}

.tile-16 {
    background: #f59563;
    color: white;
}

.tile-32 {
    background: #f67c5f;
    color: white;
}

.tile-64 {
    background: #f65e3b;
    color: white;
}

.tile-128 {
    background: #edcf72;
    color: white;
    font-size: clamp(25px, 7vw, 40px);
}

.tile-256 {
    background: #edcc61;
    color: white;
    font-size: clamp(25px, 7vw, 40px);
}

.tile-512 {
    background: #edc850;
    color: white;
    font-size: clamp(25px, 7vw, 40px);
}

.tile-1024 {
    background: #edc53f;
    color: white;
    font-size: clamp(20px, 6vw, 34px);
}

.tile-2048 {
    background: #edc22e;
    color: white;
    font-size: clamp(20px, 6vw, 34px);
}

/* Game over */

.message {
    position: absolute;
    inset: 0;

    background: rgba(238, 228, 218, 0.85);

    border-radius: 8px;

    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;

    z-index: 20;
}

.message h2 {
    font-size: 42px;
    margin: 0 0 15px;
}

.message button,
.new-game {
    border: none;
    background: #8f7a66;
    color: white;

    padding: 12px 20px;

    border-radius: 6px;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;
}

.message button:hover,
.new-game:hover {
    filter: brightness(1.1);
}

.bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 15px;
}

.controls {
    font-size: 13px;
}

@media (max-width: 500px) {
    h1 {
        font-size: 55px;
    }

    .instructions {
        font-size: 13px;
    }
}
</style>

</head>

<body>

<div class="game">

```
<div class="top">
    <h1>2048</h1>

    <div class="score-box">
        <div class="score-label">SCORE</div>
        <div id="score">0</div>
    </div>
</div>

<div class="instructions">
    Use the <b>arrow keys</b> to move the tiles. Combine matching numbers!
</div>

<div class="board" id="board">

    <!-- Background grid -->

    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>

    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>

    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>

    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>

        <h2 id="messageText">Game Over!</h2>

        <button onclick="newGame()">
            Play Again
        </button>

    </div>

</div>

    </div>

        New Game
    </button>

```

</div>

<script>

let tiles = [];
let nextId = 1;

let score = 0;
let gameOver = false;
let moving = false;

const boardElement = document.getElementById("board");
const scoreElement = document.getElementById("score");
const messageElement = document.getElementById("message");
const messageText = document.getElementById("messageText");


// ====================================
// GET TILE PIXEL POSITION
// ====================================

function getTilePosition(index) {

    const row = Math.floor(index / 4);
    const col = index % 4;

    const boardWidth = boardElement.clientWidth;

    const gap = 10;
    const padding = 10;

    const tileSize =
        (boardWidth - padding * 2 - gap * 3) / 4;

    const left =
        padding + col * (tileSize + gap);

    const top =
        padding + row * (tileSize + gap);

    return {
        left: left,
        top: top,
        size: tileSize
    };
}


// ====================================
// POSITION TILE
// ====================================

function positionTile(element, position) {

    const pos = getTilePosition(position);

    element.style.left = pos.left + "px";
    element.style.top = pos.top + "px";
}


// ====================================
// NEW GAME
// ====================================

function newGame() {

    tiles = [];
    nextId = 1;

    score = 0;
    gameOver = false;
    moving = false;

    messageElement.style.display = "none";

    scoreElement.textContent = "0";

    addTile();
    addTile();

    renderTiles(true);
}


// ====================================
// ADD RANDOM TILE
// ====================================

function addTile() {

    const occupied =
        tiles.map(tile => tile.position);

    const empty = [];

    for (let i = 0; i < 16; i++) {

        if (!occupied.includes(i)) {
            empty.push(i);
        }

    }

    if (empty.length === 0) return;

    const position =
        empty[Math.floor(Math.random() * empty.length)];

    tiles.push({
        id: nextId++,
        value: Math.random() < 0.9 ? 2 : 4,
        position: position,
        spawned: true,
        merged: false
    });
}


// ====================================
// CREATE TILE
// ====================================

function createTile(tile) {

    const element =
        document.createElement("div");

    element.className =
        "tile tile-" + tile.value;

    element.dataset.id = tile.id;

    element.textContent = tile.value;

    positionTile(element, tile.position);

    if (tile.spawned) {
        element.classList.add("spawn");
    }

    if (tile.merged) {
        element.classList.add("merge");
    }

    return element;
}


// ====================================
// RENDER TILES
// ====================================

function renderTiles(initial = false) {

    const existing =
        new Map(
            [...boardElement.querySelectorAll(".tile")]
            .map(element => [
                Number(element.dataset.id),
                element
            ])
        );

    for (const tile of tiles) {

        let element =
            existing.get(tile.id);

        if (!element) {

            element = createTile(tile);

            boardElement.appendChild(element);

        } else {

            element.className =
                "tile tile-" + tile.value;

            if (tile.merged) {
                element.classList.add("merge");
            }

            element.textContent = tile.value;

            // This is what creates the sliding animation
            positionTile(element, tile.position);
        }

    }

    // Remove old tiles
    for (const [id, element] of existing) {

        if (!tiles.some(tile => tile.id === id)) {

            element.style.opacity = "0";

            setTimeout(() => {

                if (element.parentNode) {
                    element.remove();
                }

            }, 150);

        }

    }

    scoreElement.textContent = score;

    for (const tile of tiles) {
        tile.spawned = false;
        tile.merged = false;
    }
}


// ====================================
// GET ROWS / COLUMNS
// ====================================

function getLines(direction) {

    const lines = [];

    if (direction === "left") {

        for (let row = 0; row < 4; row++) {

            lines.push([
                row * 4,
                row * 4 + 1,
                row * 4 + 2,
                row * 4 + 3
            ]);

        }

    }

    if (direction === "right") {

        for (let row = 0; row < 4; row++) {

            lines.push([
                row * 4 + 3,
                row * 4 + 2,
                row * 4 + 1,
                row * 4
            ]);

        }

    }

    if (direction === "up") {

        for (let col = 0; col < 4; col++) {

            lines.push([
                col,
                col + 4,
                col + 8,
                col + 12
            ]);

        }

    }

    if (direction === "down") {

        for (let col = 0; col < 4; col++) {

            lines.push([
                col + 12,
                col + 8,
                col + 4,
                col
            ]);

        }

    }

    return lines;
}


// ====================================
// MOVE
// ====================================

function move(direction) {

    if (gameOver || moving) return;

    const lines = getLines(direction);

    let moved = false;

    for (const line of lines) {

        const lineTiles = [];

        for (const position of line) {

            const tile =
                tiles.find(t => t.position === position);

            if (tile) {
                lineTiles.push(tile);
            }

        }

        let targetIndex = 0;

        for (let i = 0; i < lineTiles.length; i++) {

            const current = lineTiles[i];

            const targetPosition =
                line[targetIndex];

            // Merge
            if (
                i + 1 < lineTiles.length &&
                current.value === lineTiles[i + 1].value
            ) {

                const next =
                    lineTiles[i + 1];

                current.position =
                    targetPosition;

                next.position =
                    targetPosition;

                next.value *= 2;

                next.merged = true;

                score += next.value;

                tiles =
                    tiles.filter(
                        tile => tile.id !== current.id
                    );

                moved = true;

                i++;
                targetIndex++;

            } else {

                if (
                    current.position !==
                    targetPosition
                ) {
                    moved = true;
                }

                current.position =
                    targetPosition;

                targetIndex++;
            }

        }

    }

    if (!moved) return;

    moving = true;

    renderTiles();

    // Wait for the sliding animation
    setTimeout(() => {

        addTile();

        renderTiles();

        moving = false;

        checkWin();
        checkGameOver();

    }, 150);
}


// ====================================
// WIN
// ====================================

function checkWin() {

    if (
        tiles.some(
            tile => tile.value >= 2048
        )
    ) {

        messageText.textContent =
            "You Win! 🎉";

        messageElement.style.display =
            "flex";

        gameOver = true;
    }
}


// ====================================
// GAME OVER
// ====================================

function checkGameOver() {

    if (gameOver) return;

    if (tiles.length < 16) return;

    const values = new Map();

    for (const tile of tiles) {
        values.set(tile.position, tile.value);
    }

    for (let row = 0; row < 4; row++) {

        for (let col = 0; col < 4; col++) {

            const index =
                row * 4 + col;

            const value =
                values.get(index);

            // Right neighbor
            if (col < 3) {

                if (
                    value ===
                    values.get(index + 1)
                ) {
                    return;
                }

            }

            // Bottom neighbor
            if (row < 3) {

                if (
                    value ===
                    values.get(index + 4)
                ) {
                    return;
                }

            }

        }

    }

    gameOver = true;

    messageText.textContent =
        "Game Over!";

    messageElement.style.display =
        "flex";
}


// ====================================
// KEYBOARD
// ====================================

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "ArrowLeft" ||
            event.key === "ArrowRight" ||
            event.key === "ArrowUp" ||
            event.key === "ArrowDown"
        ) {

            event.preventDefault();

        }

        if (event.key === "ArrowLeft") {
            move("left");
        }

        if (event.key === "ArrowRight") {
            move("right");
        }

        if (event.key === "ArrowUp") {
            move("up");
        }

        if (event.key === "ArrowDown") {
            move("down");
        }

    }
);


// ====================================
// KEEP TILES CORRECT AFTER RESIZING
// ====================================

window.addEventListener(
    "resize",
    function() {

        document
            .querySelectorAll(".tile")
            .forEach(element => {

                const id =
                    Number(element.dataset.id);

                const tile =
                    tiles.find(t => t.id === id);

                if (tile) {
                    positionTile(
                        element,
                        tile.position
                    );
                }

            });

    }
);


// Start game
newGame();

</script>

</body>
</html>
