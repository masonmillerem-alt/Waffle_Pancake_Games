<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #faf8ef;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #776e65;
}

.game {
    width: 500px;
    max-width: 95vw;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

h1 {
    font-size: 70px;
    margin: 0;
    font-weight: bold;
}

.score-box {
    background: #bbada0;
    color: white;
    padding: 8px 18px;
    border-radius: 6px;
    text-align: center;
    min-width: 90px;
}

.score-label {
    font-size: 13px;
    font-weight: bold;
}

#score {
    font-size: 25px;
    font-weight: bold;
}

.instructions {
    font-size: 15px;
    margin-bottom: 12px;
}


/* =========================
   BOARD
========================= */

.board {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #bbada0;
    border-radius: 8px;
    padding: 10px;
    position: relative;
}


/* Background grid */

.grid {
    position: absolute;
    inset: 10px;

    display: grid;

    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);

    gap: 10px;
}

.cell {
    background: #cdc1b4;
    border-radius: 6px;
}


/* =========================
   TILES
========================= */

.tile {
    position: absolute;

    display: flex;
    justify-content: center;
    align-items: center;

    border-radius: 6px;

    font-size: clamp(28px, 8vw, 48px);
    font-weight: bold;

    z-index: 5;

    /*
       Only transform is animated.
       This creates the smooth sliding.
    */
    transition: transform 150ms ease-in-out;
}


/* Merge animation only */

.tile.merge {
    animation: merge 160ms ease-out;
    z-index: 10;
}

@keyframes merge {

    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.15);
    }

    100% {
        transform: scale(1);
    }

}


/* =========================
   TILE COLORS
========================= */

.tile-2 {
    background: #eee4da;
    color: #776e65;
}

.tile-4 {
    background: #ede0c8;
    color: #776e65;
}

.tile-8 {
    background: #f2b179;
    color: white;
}

.tile-16 {
    background: #f59563;
    color: white;
}

.tile-32 {
    background: #f67c5f;
    color: white;
}

.tile-64 {
    background: #f65e3b;
    color: white;
}

.tile-128 {
    background: #edcf72;
    color: white;
    font-size: clamp(25px, 7vw, 40px);
}

.tile-256 {
    background: #edcc61;
    color: white;
    font-size: clamp(25px, 7vw, 40px);
}

.tile-512 {
    background: #edc850;
    color: white;
    font-size: clamp(25px, 7vw, 40px);
}

.tile-1024 {
    background: #edc53f;
    color: white;
    font-size: clamp(20px, 6vw, 34px);
}

.tile-2048 {
    background: #edc22e;
    color: white;
    font-size: clamp(20px, 6vw, 34px);
}


/* =========================
   MESSAGE
========================= */

.message {
    position: absolute;
    inset: 0;

    background: rgba(238, 228, 218, 0.85);

    border-radius: 8px;

    display: none;

    justify-content: center;
    align-items: center;
    flex-direction: column;

    z-index: 20;
}

.message h2 {
    font-size: 42px;
    margin: 0 0 15px;
}

.message button,
.new-game {
    border: none;

    background: #8f7a66;
    color: white;

    padding: 12px 20px;

    border-radius: 6px;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;
}

.message button:hover,
.new-game:hover {
    filter: brightness(1.1);
}


/* =========================
   BOTTOM
========================= */

.bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-top: 15px;
}

.controls {
    font-size: 13px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 500px) {

    h1 {
        font-size: 55px;
    }

    .instructions {
        font-size: 13px;
    }

}
</style>

</head>

<body>

<div class="game">

```
<!-- TOP -->

<div class="top">

    <h1>2048</h1>

    <div class="score-box">

        <div class="score-label">
            SCORE
        </div>

        <div id="score">
            0
        </div>

    </div>

</div>


<!-- INSTRUCTIONS -->

<div class="instructions">
    Use the <b>arrow keys</b> to move the tiles.
    Combine matching numbers!
</div>


<!-- BOARD -->

<div class="board" id="board">

    <!-- Background grid -->

    <div class="grid">

        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>

        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>

        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>

        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>

    </div>


    <!-- GAME OVER / WIN -->

    <div class="message" id="message">

        <h2 id="messageText">
            Game Over!
        </h2>

        <button onclick="newGame()">
            Play Again
        </button>

</div>

```

</div>

<script>


// ==========================================
// GAME VARIABLES
// ==========================================

let tiles = [];

let nextId = 1;

let score = 0;

let gameOver = false;

let moving = false;


// ==========================================
// ELEMENTS
// ==========================================

const board =
    document.getElementById("board");

const scoreDisplay =
    document.getElementById("score");

const message =
    document.getElementById("message");

const messageText =
    document.getElementById("messageText");


// ==========================================
// GET BOARD MEASUREMENTS
// ==========================================

function getMeasurements() {

    const boardWidth =
        board.clientWidth;

    const padding = 10;

    const gap = 10;

    const usableWidth =
        boardWidth -
        padding * 2;

    const tileSize =
        (usableWidth -
            gap * 3) / 4;

    return {

        tileSize: tileSize,

        gap: gap,

        padding: padding

    };

}


// ==========================================
// GET TILE COORDINATES
// ==========================================

function getCoordinates(position) {

    const measurements =
        getMeasurements();


    const row =
        Math.floor(position / 4);

    const column =
        position % 4;


    const left =
        measurements.padding +
        column *
        (
            measurements.tileSize +
            measurements.gap
        );


    const top =
        measurements.padding +
        row *
        (
            measurements.tileSize +
            measurements.gap
        );


    return {

        left: left,

        top: top,

        size:
            measurements.tileSize

    };

}


// ==========================================
// POSITION TILE
// ==========================================

function positionTile(
    element,
    position
) {

    const coordinates =
        getCoordinates(position);


    element.style.width =
        coordinates.size + "px";


    element.style.height =
        coordinates.size + "px";


    /*
       All tiles start at 0,0.
       Transform moves them to the
       correct square.
    */

    element.style.left =
        "0px";

    element.style.top =
        "0px";


    element.style.transform =
        `translate(
            ${coordinates.left}px,
            ${coordinates.top}px
        )`;

}


// ==========================================
// CREATE TILE
// ==========================================

function createTile(tile) {

    const element =
        document.createElement("div");


    element.className =
        "tile tile-" +
        tile.value;


    element.dataset.id =
        tile.id;


    element.textContent =
        tile.value;


    /*
       IMPORTANT:
       The tile is positioned BEFORE
       being added to the board.

       Therefore it appears instantly
       in its correct square.
    */

    positionTile(
        element,
        tile.position
    );


    return element;

}


// ==========================================
// NEW GAME
// ==========================================

function newGame() {

    tiles = [];

    nextId = 1;

    score = 0;

    gameOver = false;

    moving = false;


    message.style.display =
        "none";


    scoreDisplay.textContent =
        "0";


    addTile();

    addTile();


    render();

}


// ==========================================
// ADD RANDOM TILE
// ==========================================

function addTile() {

    const occupied =
        tiles.map(
            tile =>
                tile.position
        );


    const empty = [];


    for (
        let i = 0;
        i < 16;
        i++
    ) {

        if (
            !occupied.includes(i)
        ) {

            empty.push(i);

        }

    }


    if (empty.length === 0) {
        return;
    }


    const position =
        empty[
            Math.floor(
                Math.random() *
                empty.length
            )
        ];


    tiles.push({

        id: nextId++,

        value:
            Math.random() < 0.9
                ? 2
                : 4,

        position: position,

        merged: false

    });

}


// ==========================================
// RENDER TILES
// ==========================================

function render() {

    const existing =
        new Map();


    board
        .querySelectorAll(".tile")
        .forEach(element => {

            existing.set(
                Number(
                    element.dataset.id
                ),
                element
            );

        });


    // Update or create tiles

    for (const tile of tiles) {

        let element =
            existing.get(tile.id);


        // New tile

        if (!element) {

            element =
                createTile(tile);


            /*
               It is already positioned
               before being added.
               No sliding from top-left.
            */

            board.appendChild(
                element
            );

        }


        // Existing tile

        else {

            element.className =
                "tile tile-" +
                tile.value;


            element.textContent =
                tile.value;


            if (tile.merged) {

                element.classList.add(
                    "merge"
                );

            }


            /*
               Existing tiles use
               transform transition,
               producing the slide.
            */

            positionTile(
                element,
                tile.position
            );

        }

    }


    // Remove old tiles

    for (
        const [id, element]
        of existing
    ) {

        const stillExists =
            tiles.some(
                tile =>
                    tile.id === id
            );


        if (!stillExists) {

            element.style.opacity =
                "0";


            setTimeout(() => {

                if (
                    element.parentNode
                ) {

                    element.remove();

                }

            }, 150);

        }

    }


    scoreDisplay.textContent =
        score;


    // Reset merge flags

    for (const tile of tiles) {

        tile.merged = false;

    }

}


// ==========================================
// GET MOVEMENT LINES
// ==========================================

function getLines(direction) {

    const lines = [];


    if (direction === "left") {

        for (
            let row = 0;
            row < 4;
            row++
        ) {

            lines.push([

                row * 4,

                row * 4 + 1,

                row * 4 + 2,

                row * 4 + 3

            ]);

        }

    }


    if (direction === "right") {

        for (
            let row = 0;
            row < 4;
            row++
        ) {

            lines.push([

                row * 4 + 3,

                row * 4 + 2,

                row * 4 + 1,

                row * 4

            ]);

        }

    }


    if (direction === "up") {

        for (
            let column = 0;
            column < 4;
            column++
        ) {

            lines.push([

                column,

                column + 4,

                column + 8,

                column + 12

            ]);

        }

    }


    if (direction === "down") {

        for (
            let column = 0;
            column < 4;
            column++
        ) {

            lines.push([

                column + 12,

                column + 8,

                column + 4,

                column

            ]);

        }

    }


    return lines;

}


// ==========================================
// MOVE
// ==========================================

function move(direction) {

    if (
        gameOver ||
        moving
    ) {

        return;

    }


    const lines =
        getLines(direction);


    let moved = false;


    for (const line of lines) {

        const lineTiles = [];


        // Find tiles in this line

        for (
            const position
            of line
        ) {

            const tile =
                tiles.find(
                    t =>
                        t.position ===
                        position
                );


            if (tile) {

                lineTiles.push(tile);

            }

        }


        let targetIndex = 0;


        for (
            let i = 0;
            i < lineTiles.length;
            i++
        ) {

            const current =
                lineTiles[i];


            const targetPosition =
                line[targetIndex];


            // ==================================
            // MERGE
            // ==================================

            if (

                i + 1 <
                lineTiles.length &&

                current.value ===
                lineTiles[i + 1].value

            ) {

                const next =
                    lineTiles[i + 1];


                current.position =
                    targetPosition;


                next.position =
                    targetPosition;


                next.value *= 2;


                next.merged = true;


                score +=
                    next.value;


                tiles =
                    tiles.filter(
                        tile =>
                            tile.id !==
                            current.id
                    );


                moved = true;


                i++;

                targetIndex++;

            }


            // ==================================
            // NORMAL MOVE
            // ==================================

            else {

                if (
                    current.position !==
                    targetPosition
                ) {

                    moved = true;

                }


                current.position =
                    targetPosition;


                targetIndex++;

            }

        }

    }


    if (!moved) {

        return;

    }


    moving = true;


    // Animate movement

    render();


    // Wait for slide

    setTimeout(() => {

        addTile();

        render();


        moving = false;


        checkWin();

        checkGameOver();

    }, 160);

}


// ==========================================
// CHECK WIN
// ==========================================

function checkWin() {

    const won =
        tiles.some(
            tile =>
                tile.value >=
                2048
        );


    if (!won) {

        return;

    }


    messageText.textContent =
        "You Win! 🎉";


    message.style.display =
        "flex";


    gameOver = true;

}


// ==========================================
// CHECK GAME OVER
// ==========================================

function checkGameOver() {

    if (gameOver) {

        return;

    }


    if (tiles.length < 16) {

        return;

    }


    const values =
        new Map();


    for (const tile of tiles) {

        values.set(
            tile.position,
            tile.value
        );

    }


    for (
        let row = 0;
        row < 4;
        row++
    ) {

        for (
            let column = 0;
            column < 4;
            column++
        ) {

            const index =
                row * 4 +
                column;


            const value =
                values.get(index);


            // Right

            if (column < 3) {

                if (
                    value ===
                    values.get(
                        index + 1
                    )
                ) {

                    return;

                }

            }


            // Down

            if (row < 3) {

                if (
                    value ===
                    values.get(
                        index + 4
                    )
                ) {

                    return;

                }

            }

        }

    }


    gameOver = true;


    messageText.textContent =
        "Game Over!";


    message.style.display =
        "flex";

}


// ==========================================
// KEYBOARD CONTROLS
// ==========================================

document.addEventListener(
    "keydown",
    function(event) {

        if (

            event.key ===
                "ArrowLeft" ||

            event.key ===
                "ArrowRight" ||

            event.key ===
                "ArrowUp" ||

            event.key ===
                "ArrowDown"

        ) {

            event.preventDefault();

        }


        if (
            event.key ===
            "ArrowLeft"
        ) {

            move("left");

        }

        else if (
            event.key ===
            "ArrowRight"
        ) {

            move("right");

        }

        else if (
            event.key ===
            "ArrowUp"
        ) {

            move("up");

        }

        else if (
            event.key ===
            "ArrowDown"
        ) {

            move("down");

        }

    }
);


// ==========================================
// RESIZE
// ==========================================

window.addEventListener(
    "resize",
    function() {

        /*
           Disable animation while
           the board is resizing.
        */

        document
            .querySelectorAll(".tile")
            .forEach(element => {

                const id =
                    Number(
                        element.dataset.id
                    );


                const tile =
                    tiles.find(
                        t =>
                            t.id === id
                    );


                if (tile) {

                    element.style.transition =
                        "none";


                    positionTile(
                        element,
                        tile.position
                    );


                    requestAnimationFrame(() => {

                        element.style.transition =
                            "transform 150ms ease-in-out";

                    });

                }

            });

    }
);


// ==========================================
// START
// ==========================================

newGame();

</script>

</body>
