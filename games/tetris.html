```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tetris</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .game {
        text-align: center;
    }

    h1 {
        margin: 0 0 10px;
        font-size: 32px;
    }

    .info {
        display: flex;
        justify-content: space-between;
        width: 300px;
        margin: 0 auto 10px;
        font-size: 18px;
        font-weight: bold;
    }

    canvas {
        display: block;
        width: 300px;
        height: 600px;
        background: #181818;
        border: 4px solid #444;
        box-shadow: 0 0 20px rgba(0,0,0,.5);
    }

    .controls {
        margin-top: 12px;
        font-size: 14px;
        color: #bbb;
        line-height: 1.6;
    }

    button {
        margin-top: 15px;
        padding: 10px 22px;
        border: none;
        border-radius: 8px;
        background: #f39c12;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #ffad24;
    }

    #message {
        min-height: 24px;
        margin-top: 8px;
        font-weight: bold;
    }
</style>
</head>

<body>

<div class="game">
    <h1>🧱 Tetris</h1>

    <div class="info">
        <span>Score: <span id="score">0</span></span>
        <span>Lines: <span id="lines">0</span></span>
    </div>

    <canvas id="canvas" width="300" height="600"></canvas>

    <div id="message">Press Start to play!</div>

    <button id="startButton">▶ Start Game</button>

    <div class="controls">
        ← → Move &nbsp; | &nbsp; ↓ Soft Drop<br>
        ↑ Rotate &nbsp; | &nbsp; Space Hard Drop
    </div>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const COLS = 10;
const ROWS = 20;
const BLOCK = 30;

let board = [];
let piece = null;

let score = 0;
let lines = 0;
let gameRunning = false;
let gameOver = false;

let dropCounter = 0;
let lastTime = 0;
let dropInterval = 700;

const pieces = [
    {
        shape: [
            [1, 1, 1, 1]
        ],
        color: "#00c8ff"
    },

    {
        shape: [
            [1, 1],
            [1, 1]
        ],
        color: "#ffd500"
    },

    {
        shape: [
            [0, 1, 0],
            [1, 1, 1]
        ],
        color: "#a855f7"
    },

    {
        shape: [
            [0, 1, 1],
            [1, 1, 0]
        ],
        color: "#22c55e"
    },

    {
        shape: [
            [1, 1, 0],
            [0, 1, 1]
        ],
        color: "#ef4444"
    },

    {
        shape: [
            [1, 0, 0],
            [1, 1, 1]
        ],
        color: "#3b82f6"
    },

    {
        shape: [
            [0, 0, 1],
            [1, 1, 1]
        ],
        color: "#f97316"
    }
];

function createBoard() {
    board = [];

    for (let y = 0; y < ROWS; y++) {
        board.push(new Array(COLS).fill(0));
    }
}

function createPiece() {
    const random = pieces[Math.floor(Math.random() * pieces.length)];

    piece = {
        shape: random.shape.map(row => [...row]),
        color: random.color,
        x: Math.floor(COLS / 2) - Math.ceil(random.shape[0].length / 2),
        y: 0
    };

    if (collision()) {
        endGame();
    }
}

function drawBlock(x, y, color) {
    ctx.fillStyle = color;
    ctx.fillRect(
        x * BLOCK,
        y * BLOCK,
        BLOCK,
        BLOCK
    );

    ctx.strokeStyle = "rgba(0,0,0,.35)";
    ctx.lineWidth = 2;
    ctx.strokeRect(
        x * BLOCK,
        y * BLOCK,
        BLOCK,
        BLOCK
    );
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Background grid
    ctx.strokeStyle = "#252525";
    ctx.lineWidth = 1;

    for (let x = 0; x <= COLS; x++) {
        ctx.beginPath();
        ctx.moveTo(x * BLOCK, 0);
        ctx.lineTo(x * BLOCK, canvas.height);
        ctx.stroke();
    }

    for (let y = 0; y <= ROWS; y++) {
        ctx.beginPath();
        ctx.moveTo(0, y * BLOCK);
        ctx.lineTo(canvas.width, y * BLOCK);
        ctx.stroke();
    }

    // Placed blocks
    for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
            if (board[y][x]) {
                drawBlock(x, y, board[y][x]);
            }
        }
    }

    // Current piece
    if (piece) {
        for (let y = 0; y < piece.shape.length; y++) {
            for (let x = 0; x < piece.shape[y].length; x++) {
                if (piece.shape[y][x]) {
                    drawBlock(
                        piece.x + x,
                        piece.y + y,
                        piece.color
                    );
                }
            }
        }
    }
}

function collision() {
    for (let y = 0; y < piece.shape.length; y++) {
        for (let x = 0; x < piece.shape[y].length; x++) {

            if (!piece.shape[y][x]) {
                continue;
            }

            const boardX = piece.x + x;
            const boardY = piece.y + y;

            if (
                boardX < 0 ||
                boardX >= COLS ||
                boardY >= ROWS
            ) {
                return true;
            }

            if (
                boardY >= 0 &&
                board[boardY][boardX]
            ) {
                return true;
            }
        }
    }

    return false;
}

function merge() {
    for (let y = 0; y < piece.shape.length; y++) {
        for (let x = 0; x < piece.shape[y].length; x++) {

            if (piece.shape[y][x]) {
                board[piece.y + y][piece.x + x] = piece.color;
            }
        }
    }
}

function clearLines() {
    let cleared = 0;

    for (let y = ROWS - 1; y >= 0; y--) {

        if (board[y].every(cell => cell !== 0)) {
            board.splice(y, 1);
            board.unshift(new Array(COLS).fill(0));

            cleared++;
            y++;
        }
    }

    if (cleared > 0) {
        lines += cleared;

        const points = [
            0,
            100,
            300,
            500,
            800
        ];

        score += points[cleared];

        // Gradually increase speed
        dropInterval = Math.max(
            100,
            700 - Math.floor(lines / 10) * 60
        );

        updateInfo();
    }
}

function moveDown() {
    if (!gameRunning) return;

    piece.y++;

    if (collision()) {
        piece.y--;

        merge();
        clearLines();
        createPiece();
    }

    dropCounter = 0;
}

function moveHorizontal(direction) {
    if (!gameRunning) return;

    piece.x += direction;

    if (collision()) {
        piece.x -= direction;
    }
}

function rotate() {
    if (!gameRunning) return;

    const oldShape = piece.shape;

    const rows = oldShape.length;
    const cols = oldShape[0].length;

    const rotated = [];

    for (let x = 0; x < cols; x++) {
        rotated[x] = [];

        for (let y = rows - 1; y >= 0; y--) {
            rotated[x].push(oldShape[y][x]);
        }
    }

    piece.shape = rotated;

    // Wall kick
    if (collision()) {
        piece.x++;

        if (collision()) {
            piece.x -= 2;

            if (collision()) {
                piece.x++;
                piece.shape = oldShape;
            }
        }
    }
}

function hardDrop() {
    if (!gameRunning) return;

    while (!collision()) {
        piece.y++;
    }

    piece.y--;

    merge();
    clearLines();
    createPiece();

    dropCounter = 0;
}

function updateInfo() {
    document.getElementById("score").textContent = score;
    document.getElementById("lines").textContent = lines;
}

function startGame() {
    createBoard();

    score = 0;
    lines = 0;

    dropInterval = 700;
    dropCounter = 0;
    lastTime = performance.now();

    gameRunning = true;
    gameOver = false;

    document.getElementById("message").textContent = "";

    document.getElementById("startButton").textContent = "🔄 Restart";

    updateInfo();

    createPiece();
    draw();
}

function endGame() {
    gameRunning = false;
    gameOver = true;

    document.getElementById("message").textContent =
        "Game Over! Score: " + score;

    document.getElementById("startButton").textContent =
        "🔄 Play Again";

    draw();
}

function update(time = 0) {
    if (!gameRunning) {
        draw();
        requestAnimationFrame(update);
        return;
    }

    const deltaTime = time - lastTime;
    lastTime = time;

    dropCounter += deltaTime;

    if (dropCounter > dropInterval) {
        moveDown();
    }

    draw();

    requestAnimationFrame(update);
}

document.addEventListener("keydown", event => {

    if (!gameRunning) return;

    if (
        event.key === "ArrowLeft" ||
        event.key === "ArrowRight" ||
        event.key === "ArrowDown" ||
        event.key === "ArrowUp" ||
        event.code === "Space"
    ) {
        event.preventDefault();
    }

    if (event.key === "ArrowLeft") {
        moveHorizontal(-1);
    }

    if (event.key === "ArrowRight") {
        moveHorizontal(1);
    }

    if (event.key === "ArrowDown") {
        moveDown();
    }

    if (event.key === "ArrowUp") {
        rotate();
    }

    if (event.code === "Space") {
        hardDrop();
    }
});

document.getElementById("startButton").addEventListener("click", startGame);

createBoard();
draw();
requestAnimationFrame(update);
</script>

</body>
</html>
