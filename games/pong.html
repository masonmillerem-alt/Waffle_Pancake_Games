<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pong</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
}

/* =========================
   CANVAS
========================= */

canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #111;
}


/* =========================
   SCORE
========================= */

.score {
    position: fixed;

    top: 25px;
    left: 50%;

    transform: translateX(-50%);

    color: white;

    font-size: 45px;
    font-weight: bold;

    display: flex;
    gap: 80px;

    pointer-events: none;
}


/* =========================
   MENU
========================= */

.menu {
    position: fixed;

    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(0, 0, 0, 0.78);

    z-index: 10;
}

.menu-box {
    width: min(420px, 90%);

    padding: 30px;

    border-radius: 20px;

    background: #222;

    color: white;

    text-align: center;

    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.menu-box h1 {
    margin-top: 0;
    margin-bottom: 25px;

    font-size: 38px;
}

.menu-box h2 {
    font-size: 20px;
    margin-bottom: 12px;
}


/* =========================
   MODE BUTTONS
========================= */

.mode-buttons {
    display: flex;
    gap: 12px;

    margin-bottom: 25px;
}

.mode-button {
    flex: 1;

    padding: 14px 10px;

    border: none;
    border-radius: 10px;

    background: #444;

    color: white;

    font-size: 17px;
    font-weight: bold;

    cursor: pointer;
}

.mode-button:hover {
    background: #555;
}

.mode-button.selected {
    background: #ff9d1c;
}


/* =========================
   DIFFICULTY
========================= */

.difficulty {
    margin-bottom: 25px;
}

.difficulty-buttons {
    display: flex;
    gap: 10px;
}

.difficulty-button {
    flex: 1;

    padding: 12px 8px;

    border: none;
    border-radius: 10px;

    background: #444;

    color: white;

    font-weight: bold;

    cursor: pointer;
}

.difficulty-button:hover {
    background: #555;
}

.difficulty-button.selected {
    background: #ff9d1c;
}


/* =========================
   START BUTTON
========================= */

.start-button {
    width: 100%;

    padding: 15px;

    border: none;
    border-radius: 12px;

    background: #ff9d1c;

    color: white;

    font-size: 20px;
    font-weight: bold;

    cursor: pointer;
}

.start-button:hover {
    background: #ffad32;
}


/* =========================
   INSTRUCTIONS
========================= */

.instructions {
    position: fixed;

    bottom: 20px;
    left: 50%;

    transform: translateX(-50%);

    color: #aaa;

    font-size: 15px;

    text-align: center;

    pointer-events: none;
}

</style>
</head>

<body>

<canvas id="gameCanvas"></canvas>


<!-- SCORE -->

<div class="score">
    <span id="playerScore">0</span>
    <span id="opponentScore">0</span>
</div>


<!-- MENU -->

<div class="menu" id="menu">

    <div class="menu-box">

        <h1>Pong</h1>

        <h2>Game Mode</h2>

        <div class="mode-buttons">

            <button
                class="mode-button selected"
                id="singleplayerButton"
                type="button">

                Singleplayer

            </button>

            <button
                class="mode-button"
                id="multiplayerButton"
                type="button">

                Multiplayer

            </button>

        </div>


        <!-- DIFFICULTY -->

        <div
            class="difficulty"
            id="difficultySection">

            <h2>Bot Difficulty</h2>

            <div class="difficulty-buttons">

                <button
                    class="difficulty-button selected"
                    data-difficulty="easy"
                    type="button">

                    Easy

                </button>

                <button
                    class="difficulty-button"
                    data-difficulty="normal"
                    type="button">

                    Normal

                </button>

                <button
                    class="difficulty-button"
                    data-difficulty="hard"
                    type="button">

                    Hard

                </button>

            </div>

        </div>


        <button
            class="start-button"
            id="startButton"
            type="button">

            Start Game

        </button>

    </div>

</div>


<!-- INSTRUCTIONS -->

<div class="instructions" id="instructions">
    W / S to move
</div>


<script>

/* =========================
   CANVAS
========================= */

const canvas =
    document.getElementById("gameCanvas");

const ctx =
    canvas.getContext("2d");


function resizeCanvas() {

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

}

resizeCanvas();

window.addEventListener("resize", resizeCanvas);


/* =========================
   UI
========================= */

const menu =
    document.getElementById("menu");

const singleplayerButton =
    document.getElementById("singleplayerButton");

const multiplayerButton =
    document.getElementById("multiplayerButton");

const difficultySection =
    document.getElementById("difficultySection");

const startButton =
    document.getElementById("startButton");

const instructions =
    document.getElementById("instructions");

const playerScoreText =
    document.getElementById("playerScore");

const opponentScoreText =
    document.getElementById("opponentScore");


/* =========================
   GAME SETTINGS
========================= */

let gameMode = "singleplayer";

let difficulty = "easy";

let gameRunning = false;


/* =========================
   PADDLES
========================= */

const paddleWidth = 15;
const paddleHeight = 110;

const paddleMargin = 35;

let player = {
    x: paddleMargin,
    y: 0,
    speed: 7
};

let opponent = {
    x: 0,
    y: 0,
    speed: 5
};


/* =========================
   BALL
========================= */

const ballSize = 14;

/*
    Slower ball speed.
    The old version was faster.
*/

const ballSpeed = 4;

let ball = {
    x: 0,
    y: 0,
    dx: ballSpeed,
    dy: ballSpeed
};


/* =========================
   SCORE
========================= */

let playerScore = 0;
let opponentScore = 0;


/* =========================
   KEYS
========================= */

const keys = {};

window.addEventListener("keydown", function(event) {

    keys[event.key] = true;

});

window.addEventListener("keyup", function(event) {

    keys[event.key] = false;

});


/* =========================
   MODE SELECTION
========================= */

singleplayerButton.addEventListener("click", function() {

    gameMode = "singleplayer";

    singleplayerButton.classList.add("selected");
    multiplayerButton.classList.remove("selected");

    difficultySection.style.display = "block";

    instructions.textContent =
        "W / S to move";

});


multiplayerButton.addEventListener("click", function() {

    gameMode = "multiplayer";

    multiplayerButton.classList.add("selected");
    singleplayerButton.classList.remove("selected");

    difficultySection.style.display = "none";

    instructions.textContent =
        "Player 1: W / S     |     Player 2: ↑ / ↓";

});


/* =========================
   DIFFICULTY SELECTION
========================= */

const difficultyButtons =
    document.querySelectorAll(".difficulty-button");


difficultyButtons.forEach(function(button) {

    button.addEventListener("click", function() {

        difficulty =
            button.dataset.difficulty;

        difficultyButtons.forEach(function(otherButton) {

            otherButton.classList.remove("selected");

        });

        button.classList.add("selected");

    });

});


/* =========================
   START GAME
========================= */

startButton.addEventListener("click", function() {

    startGame();

});


function startGame() {

    playerScore = 0;
    opponentScore = 0;

    playerScoreText.textContent = "0";
    opponentScoreText.textContent = "0";

    player.y =
        canvas.height / 2 - paddleHeight / 2;

    opponent.y =
        canvas.height / 2 - paddleHeight / 2;

    opponent.x =
        canvas.width - paddleMargin - paddleWidth;

    resetBall();

    setDifficulty();

    menu.style.display = "none";

    gameRunning = true;

}


/* =========================
   DIFFICULTY SETTINGS
========================= */

function setDifficulty() {

    if (difficulty === "easy") {

        opponent.speed = 3.5;

    }

    else if (difficulty === "normal") {

        opponent.speed = 5;

    }

    else if (difficulty === "hard") {

        opponent.speed = 6.5;

    }

}


/* =========================
   RESET BALL
========================= */

function resetBall() {

    ball.x =
        canvas.width / 2 - ballSize / 2;

    ball.y =
        canvas.height / 2 - ballSize / 2;

    /*
        Random direction.
        Speed stays slow.
    */

    const horizontalDirection =
        Math.random() < 0.5 ? -1 : 1;

    const verticalDirection =
        Math.random() < 0.5 ? -1 : 1;

    ball.dx =
        ballSpeed * horizontalDirection;

    ball.dy =
        ballSpeed * verticalDirection;

}


/* =========================
   UPDATE
========================= */

function update() {

    if (!gameRunning) {
        return;
    }


    /* PLAYER 1 */

    if (keys["w"] || keys["W"]) {

        player.y -= player.speed;

    }

    if (keys["s"] || keys["S"]) {

        player.y += player.speed;

    }


    /* PLAYER 2 / BOT */

    if (gameMode === "multiplayer") {

        if (keys["ArrowUp"]) {

            opponent.y -= opponent.speed;

        }

        if (keys["ArrowDown"]) {

            opponent.y += opponent.speed;

        }

    }

    else {

        updateBot();

    }


    /* Keep paddles inside screen */

    player.y =
        Math.max(
            0,
            Math.min(
                canvas.height - paddleHeight,
                player.y
            )
        );

    opponent.y =
        Math.max(
            0,
            Math.min(
                canvas.height - paddleHeight,
                opponent.y
            )
        );


    /* BALL */

    ball.x += ball.dx;
    ball.y += ball.dy;


    /* TOP / BOTTOM */

    if (ball.y <= 0) {

        ball.y = 0;
        ball.dy *= -1;

    }

    if (ball.y + ballSize >= canvas.height) {

        ball.y =
            canvas.height - ballSize;

        ball.dy *= -1;

    }


    /* PLAYER PADDLE */

    if (

        ball.x <=
            player.x + paddleWidth &&

        ball.x + ballSize >=
            player.x &&

        ball.y + ballSize >=
            player.y &&

        ball.y <=
            player.y + paddleHeight &&

        ball.dx < 0

    ) {

        ball.x =
            player.x + paddleWidth;

        ball.dx *= -1;

        addPaddleAngle(player);

    }


    /* OPPONENT PADDLE */

    if (

        ball.x + ballSize >=
            opponent.x &&

        ball.x <=
            opponent.x + paddleWidth &&

        ball.y + ballSize >=
            opponent.y &&

        ball.y <=
            opponent.y + paddleHeight &&

        ball.dx > 0

    ) {

        ball.x =
            opponent.x - ballSize;

        ball.dx *= -1;

        addPaddleAngle(opponent);

    }


    /* PLAYER MISSES */

    if (ball.x < -ballSize) {

        opponentScore++;

        opponentScoreText.textContent =
            opponentScore;

        resetBall();

    }


    /* OPPONENT MISSES */

    if (ball.x > canvas.width) {

        playerScore++;

        playerScoreText.textContent =
            playerScore;

        resetBall();

    }

}


/* =========================
   BALL ANGLE
========================= */

function addPaddleAngle(paddle) {

    const paddleCenter =
        paddle.y + paddleHeight / 2;

    const ballCenter =
        ball.y + ballSize / 2;

    const difference =
        ballCenter - paddleCenter;

    const normalized =
        difference / (paddleHeight / 2);

    /*
        Keep the ball slow while
        changing its direction.
    */

    ball.dy =
        normalized * ballSpeed;

    /*
        Prevent completely horizontal
        movement.
    */

    if (Math.abs(ball.dy) < 1) {

        ball.dy =
            ball.dy < 0 ? -1 : 1;

    }

}


/* =========================
   BOT
========================= */

function updateBot() {

    let target =
        ball.y - paddleHeight / 2;

    /*
        The bot does NOT perfectly follow
        the ball anymore.
    */

    if (difficulty === "easy") {

        // Slow reaction + lots of error
        if (Math.random() < 0.08) {
            target += Math.random() * 180 - 90;
        }

        if (opponent.y < target) {
            opponent.y += 2.2;
        }
        else if (opponent.y > target) {
            opponent.y -= 2.2;
        }

    }

    else if (difficulty === "normal") {

        // Reasonable reaction, but still makes mistakes
        if (Math.random() < 0.035) {
            target += Math.random() * 120 - 60;
        }

        if (opponent.y < target) {
            opponent.y += 3.5;
        }
        else if (opponent.y > target) {
            opponent.y -= 3.5;
        }

    }

    else if (difficulty === "hard") {

        // Fast, but still not perfect
        if (Math.random() < 0.015) {
            target += Math.random() * 80 - 40;
        }

        if (opponent.y < target) {
            opponent.y += 4.8;
        }
        else if (opponent.y > target) {
            opponent.y -= 4.8;
        }

    }

}


/* =========================
   DRAW
========================= */

function draw() {

    /* Background */

    ctx.fillStyle = "#111";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* Center line */

    ctx.strokeStyle = "#444";

    ctx.lineWidth = 4;

    ctx.setLineDash([15, 15]);

    ctx.beginPath();

    ctx.moveTo(
        canvas.width / 2,
        0
    );

    ctx.lineTo(
        canvas.width / 2,
        canvas.height
    );

    ctx.stroke();

    ctx.setLineDash([]);


    /* Player paddle */

    ctx.fillStyle = "white";

    ctx.fillRect(
        player.x,
        player.y,
        paddleWidth,
        paddleHeight
    );


    /* Opponent paddle */

    ctx.fillRect(
        opponent.x,
        opponent.y,
        paddleWidth,
        paddleHeight
    );


    /* Ball */

    ctx.fillRect(
        ball.x,
        ball.y,
        ballSize,
        ballSize
    );

}


/* =========================
   GAME LOOP
========================= */

function gameLoop() {

    update();

    draw();

    requestAnimationFrame(gameLoop);

}


gameLoop();

</script>

</body>
</html>
```
