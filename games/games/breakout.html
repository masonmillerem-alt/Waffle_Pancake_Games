```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breakout</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game {
            text-align: center;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 32px;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 10px;
            font-size: 18px;
        }

        canvas {
            display: block;
            width: 600px;
            height: 600px;
            max-width: 90vw;
            max-height: 70vh;

            background: #050505;
            border: 4px solid #f5a623;
            border-radius: 6px;
        }

        .controls {
            margin-top: 12px;
            color: #ccc;
            font-size: 14px;
            line-height: 1.6;
        }

        .overlay {
            position: fixed;
            inset: 0;

            background: rgba(0, 0, 0, 0.82);

            display: flex;
            align-items: center;
            justify-content: center;

            z-index: 10;
        }

        .menu {
            background: #222;
            border: 3px solid #f5a623;
            border-radius: 15px;

            padding: 30px 45px;

            text-align: center;

            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .menu h2 {
            margin-top: 0;
            font-size: 30px;
        }

        .menu p {
            color: #ccc;
        }

        button {
            border: none;
            border-radius: 10px;

            padding: 13px 28px;

            background: #f5a623;
            color: white;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #ffb638;
        }
    </style>
</head>

<body>

<div class="game">

    <h1>🎾 Breakout</h1>

    <div class="stats">
        <div>
            Score:
            <span id="score">0</span>
        </div>

        <div>
            Lives:
            <span id="lives">3</span>
        </div>
    </div>

    <canvas
        id="game"
        width="600"
        height="600">
    </canvas>

    <div class="controls">
        ← → Move Paddle &nbsp; | &nbsp; Mouse also works
    </div>

</div>


<!-- START / GAME OVER MENU -->

<div class="overlay" id="overlay">

    <div class="menu">

        <h2 id="menuTitle">
            Breakout
        </h2>

        <p id="menuText">
            Break all the blocks!
        </p>

        <button
            id="startButton"
            onclick="startGame()">
            ▶ Start Game
        </button>

    </div>

</div>


<script>

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");


/* =========================
   GAME SETTINGS
========================= */

const WIDTH = 600;
const HEIGHT = 600;

let running = false;

let score = 0;
let lives = 3;

let animationFrame;


/* =========================
   PADDLE
========================= */

const paddle = {

    width: 100,
    height: 15,

    x: 250,

    y: 550,

    speed: 8,

    left: false,
    right: false

};


/* =========================
   BALL
========================= */

const ball = {

    x: 300,
    y: 520,

    radius: 9,

    dx: 4,
    dy: -4

};


/* =========================
   BRICKS
========================= */

const brickSettings = {

    rows: 6,
    columns: 8,

    width: 62,
    height: 22,

    padding: 8,

    top: 60,
    left: 30

};

let bricks = [];


function createBricks() {

    bricks = [];

    for (
        let row = 0;
        row < brickSettings.rows;
        row++
    ) {

        for (
            let column = 0;
            column < brickSettings.columns;
            column++
        ) {

            bricks.push({

                x:
                    brickSettings.left +
                    column *
                    (
                        brickSettings.width +
                        brickSettings.padding
                    ),

                y:
                    brickSettings.top +
                    row *
                    (
                        brickSettings.height +
                        brickSettings.padding
                    ),

                width:
                    brickSettings.width,

                height:
                    brickSettings.height,

                alive: true

            });

        }

    }

}


/* =========================
   RESET BALL
========================= */

function resetBall() {

    ball.x = WIDTH / 2;

    ball.y = 520;

    ball.dx =
        Math.random() > 0.5
            ? 4
            : -4;

    ball.dy = -4;

    paddle.x =
        WIDTH / 2 -
        paddle.width / 2;

}


/* =========================
   START GAME
========================= */

function startGame() {

    score = 0;

    lives = 3;

    updateStats();

    createBricks();

    resetBall();

    paddle.x =
        WIDTH / 2 -
        paddle.width / 2;

    document.getElementById("overlay")
        .style.display = "none";

    running = true;

    cancelAnimationFrame(animationFrame);

    gameLoop();

}


/* =========================
   UPDATE STATS
========================= */

function updateStats() {

    document.getElementById("score")
        .textContent = score;

    document.getElementById("lives")
        .textContent = lives;

}


/* =========================
   DRAW PADDLE
========================= */

function drawPaddle() {

    ctx.fillStyle = "#f5a623";

    ctx.fillRect(
        paddle.x,
        paddle.y,
        paddle.width,
        paddle.height
    );

}


/* =========================
   DRAW BALL
========================= */

function drawBall() {

    ctx.beginPath();

    ctx.arc(
        ball.x,
        ball.y,
        ball.radius,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "white";

    ctx.fill();

    ctx.closePath();

}


/* =========================
   DRAW BRICKS
========================= */

function drawBricks() {

    for (const brick of bricks) {

        if (!brick.alive) {
            continue;
        }

        ctx.fillStyle = "#f5a623";

        ctx.fillRect(
            brick.x,
            brick.y,
            brick.width,
            brick.height
        );

        ctx.strokeStyle =
            "rgba(255,255,255,0.25)";

        ctx.strokeRect(
            brick.x,
            brick.y,
            brick.width,
            brick.height
        );

    }

}


/* =========================
   DRAW EVERYTHING
========================= */

function draw() {

    ctx.clearRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );

    drawBricks();

    drawPaddle();

    drawBall();

}


/* =========================
   PADDLE MOVEMENT
========================= */

function updatePaddle() {

    if (paddle.left) {

        paddle.x -= paddle.speed;

    }

    if (paddle.right) {

        paddle.x += paddle.speed;

    }

    if (paddle.x < 0) {

        paddle.x = 0;

    }

    if (
        paddle.x + paddle.width > WIDTH
    ) {

        paddle.x =
            WIDTH - paddle.width;

    }

}


/* =========================
   BALL MOVEMENT
========================= */

function updateBall() {

    ball.x += ball.dx;

    ball.y += ball.dy;


    /* LEFT WALL */

    if (
        ball.x - ball.radius <= 0
    ) {

        ball.x = ball.radius;

        ball.dx = Math.abs(ball.dx);

    }


    /* RIGHT WALL */

    if (
        ball.x + ball.radius >= WIDTH
    ) {

        ball.x =
            WIDTH - ball.radius;

        ball.dx =
            -Math.abs(ball.dx);

    }


    /* TOP WALL */

    if (
        ball.y - ball.radius <= 0
    ) {

        ball.y = ball.radius;

        ball.dy =
            Math.abs(ball.dy);

    }


    /* PADDLE */

    if (

        ball.y + ball.radius >= paddle.y &&

        ball.y - ball.radius <=
            paddle.y + paddle.height &&

        ball.x >= paddle.x &&

        ball.x <=
            paddle.x + paddle.width &&

        ball.dy > 0

    ) {

        ball.y =
            paddle.y - ball.radius;

        ball.dy =
            -Math.abs(ball.dy);


        /*
            Change the horizontal
            direction depending on
            where the ball hits.
        */

        const hitPosition =
            (
                ball.x -
                (
                    paddle.x +
                    paddle.width / 2
                )
            )
            /
            (
                paddle.width / 2
            );

        ball.dx =
            hitPosition * 6;

    }


    /* BRICKS */

    for (const brick of bricks) {

        if (!brick.alive) {
            continue;
        }

        if (

            ball.x + ball.radius >= brick.x &&

            ball.x - ball.radius <=
                brick.x + brick.width &&

            ball.y + ball.radius >= brick.y &&

            ball.y - ball.radius <=
                brick.y + brick.height

        ) {

            brick.alive = false;

            score += 10;

            updateStats();

            ball.dy *= -1;

            break;

        }

    }


    /* ALL BRICKS DESTROYED */

    const remaining =
        bricks.some(
            brick => brick.alive
        );

    if (!remaining) {

        winGame();

        return;

    }


    /* BALL FALLS */

    if (
        ball.y - ball.radius > HEIGHT
    ) {

        loseLife();

    }

}


/* =========================
   LOSE LIFE
========================= */

function loseLife() {

    lives--;

    updateStats();

    if (lives <= 0) {

        gameOver();

        return;

    }

    resetBall();

}


/* =========================
   WIN
========================= */

function winGame() {

    running = false;

    document.getElementById("menuTitle")
        .textContent = "You Win! 🎉";

    document.getElementById("menuText")
        .textContent =
        "You broke every block! Score: " +
        score;

    document.getElementById("startButton")
        .textContent = "▶ Play Again";

    document.getElementById("overlay")
        .style.display = "flex";

}


/* =========================
   GAME OVER
========================= */

function gameOver() {

    running = false;

    document.getElementById("menuTitle")
        .textContent = "Game Over!";

    document.getElementById("menuText")
        .textContent =
        "Final Score: " + score;

    document.getElementById("startButton")
        .textContent = "▶ Play Again";

    document.getElementById("overlay")
        .style.display = "flex";

}


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "ArrowLeft") {

            paddle.left = true;

        }

        if (event.key === "ArrowRight") {

            paddle.right = true;

        }

    }
);


document.addEventListener(
    "keyup",
    function(event) {

        if (event.key === "ArrowLeft") {

            paddle.left = false;

        }

        if (event.key === "ArrowRight") {

            paddle.right = false;

        }

    }
);


/* =========================
   MOUSE CONTROL
========================= */

canvas.addEventListener(
    "mousemove",
    function(event) {

        const rect =
            canvas.getBoundingClientRect();

        const scale =
            WIDTH / rect.width;

        const mouseX =
            (event.clientX - rect.left) *
            scale;

        paddle.x =
            mouseX -
            paddle.width / 2;

        if (paddle.x < 0) {

            paddle.x = 0;

        }

        if (
            paddle.x + paddle.width > WIDTH
        ) {

            paddle.x =
                WIDTH - paddle.width;

        }

    }
);


/* =========================
   GAME LOOP
========================= */

function gameLoop() {

    if (!running) {
        return;
    }

    updatePaddle();

    updateBall();

    draw();

    animationFrame =
        requestAnimationFrame(
            gameLoop
        );

}


/* =========================
   INITIAL SCREEN
========================= */

createBricks();

draw();

</script>

</body>
</html>
